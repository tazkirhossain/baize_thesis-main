[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baize"
version = "0.1.0"
description = "Five-client federated Adult/Non-adult URL classification with Character CNN and DeBERTa-v3-base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.4.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "tldextract==5.3.1",
    "packaging==24.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
neural = ["torch==2.8.0"]
deberta = ["torch==2.8.0", "transformers==4.55.4", "sentencepiece==0.2.1"]
federated = ["torch==2.8.0", "flwr==1.22.0"]
reporting = ["matplotlib==3.10.3"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
